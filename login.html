<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — QR Code Generator</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            primary: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' },
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="min-h-screen font-sans bg-gradient-to-br from-indigo-50 via-white to-purple-50 dark:from-gray-950 dark:via-gray-900 dark:to-indigo-950 text-gray-800 dark:text-gray-100">

  <!-- Background Orbs -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="glass-card p-8 sm:p-10 w-full max-w-md">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-primary-500 to-purple-500 flex items-center justify-center shadow-lg shadow-primary-500/25 mx-auto mb-4">
          <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-primary-600 to-purple-600 bg-clip-text text-transparent">Admin Login</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Sign in to access analytics dashboards</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="space-y-4">
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username"
              class="form-input w-full" placeholder="Enter username" />
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password"
              class="form-input w-full" placeholder="Enter password" />
          </div>
        </div>

        <!-- Error Message -->
        <div id="errorMsg" class="hidden mt-4 p-3 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">
          <p class="text-sm text-red-600 dark:text-red-400 font-medium" id="errorText"></p>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary w-full mt-6 py-3 text-sm font-semibold">
          <span id="btnText">Sign In</span>
          <svg id="btnSpinner" class="hidden w-4 h-4 animate-spin ml-2" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="/" class="text-sm text-gray-400 hover:text-primary-500 transition-colors">&larr; Back to QR Generator</a>
      </div>
    </div>
  </div>

<script>
  // Dark mode
  const isDark = localStorage.getItem('qr-darkmode') === 'true' ||
    (!localStorage.getItem('qr-darkmode') && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (isDark) document.documentElement.classList.add('dark');

  // If already logged in, redirect to intended page
  fetch('/api/login.php', { credentials: 'same-origin' })
    .then(r => r.json())
    .then(d => {
      if (d.authenticated) {
        const dest = new URLSearchParams(location.search).get('redirect') || '/stats.html';
        location.replace(dest);
      }
    })
    .catch(() => {});

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errDiv = document.getElementById('errorMsg');
    const errText = document.getElementById('errorText');
    const spinner = document.getElementById('btnSpinner');
    const btnLabel = document.getElementById('btnText');

    btn.disabled = true;
    spinner.classList.remove('hidden');
    btnLabel.textContent = 'Signing in...';
    errDiv.classList.add('hidden');

    try {
      const resp = await fetch('/api/login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });

      const data = await resp.json();

      if (resp.ok && data.ok) {
        const dest = new URLSearchParams(location.search).get('redirect') || '/stats.html';
        location.replace(dest);
      } else {
        errText.textContent = data.error || 'Invalid credentials';
        errDiv.classList.remove('hidden');
      }
    } catch {
      errText.textContent = 'Network error. Please try again.';
      errDiv.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      spinner.classList.add('hidden');
      btnLabel.textContent = 'Sign In';
    }
  }
</script>
</body>
</html>
